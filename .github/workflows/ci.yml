name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go 1.24.13 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
      - name: Verify toolchain
        run: go version
      - name: Download Go modules
        working-directory: services/api
        run: go mod download
      - name: Verify formatting
        run: test -z "$(gofmt -l services/api/cmd/api)"
      - name: Test
        working-directory: services/api
        run: go test ./...
      - name: Race-enabled tests
        working-directory: services/api
        run: go test -race ./...
      - name: Vet
        working-directory: services/api
        run: go vet ./...
      - name: Build
        working-directory: services/api
        run: CGO_ENABLED=0 go build -trimpath ./cmd/api

  postgres-rls:
    name: PostgreSQL migrations and RLS smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mekuin
          POSTGRES_USER: mekuin
          POSTGRES_PASSWORD: ci-migration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mekuin -d mekuin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://mekuin:ci-migration-password@localhost:5432/mekuin?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://mekuin:ci-migration-password@localhost:5432/mekuin?sslmode=disable
      MEKUIN_APP_PASSWORD: ci-runtime-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq curl
      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
      - name: Assert PostgreSQL 17
        run: test "$(psql "$DATABASE_URL" -Atqc "SHOW server_version_num" | cut -c1-2)" = "17"
      - name: Apply migrations
        run: goose -dir db/migrations postgres "$DATABASE_URL" up
      - name: Branch operational settings smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/branch_operational_settings_smoke.sql
      - name: Verify migration state
        run: |
          goose -dir db/migrations postgres "$DATABASE_URL" status
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM goose_db_version WHERE is_applied")" -eq "50"
      - name: Run authentication schema and privilege smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/auth_flows_smoke.sql
      - name: Provision runtime role
        run: sh db/scripts/configure-runtime-role.sh
      - name: Run tenant RLS smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/tenant_rls_smoke.sql
      - name: Run catalog RLS smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/catalog_rls_smoke.sql
      - name: Run manager authorization RLS and lifecycle smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/manager_authorization_rls_smoke.sql
      - name: Run staff invitation RLS and acceptance smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/staff_invitation_rls_smoke.sql
      - name: Run refunds, inventory and outbox RLS smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/refunds_inventory_outbox_rls_smoke.sql
      - name: Run M-Pesa callback ingestion privilege smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/mpesa_callback_ingestion_smoke.sql
      - name: Run M-Pesa provider reconciliation schema smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/mpesa_reconciliation_smoke.sql
      - name: Run M-Pesa atomic settlement privilege smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/mpesa_atomic_settlement_smoke.sql
      - name: Run M-Pesa dispatch outbox privilege smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/mpesa_dispatch_outbox_smoke.sql
      - name: Run M-Pesa operations visibility smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/mpesa_operations_smoke.sql
      - name: Run M-Pesa callback race recovery smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/mpesa_callback_race_recovery_smoke.sql
      - name: Run inventory operations schema smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/inventory_operations_smoke.sql
      - name: Run business integration settings schema smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/integration_settings_smoke.sql
      - name: Run cash shifts schema and privilege smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/cash_shifts_smoke.sql
      - name: Run expense management schema and privilege smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/expenses_smoke.sql
      - name: Run operational alerts and audit ledger smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/alerts_audit_smoke.sql
      - name: Run platform administration privilege smoke test
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/platform_admin_smoke.sql
      - name: Build API for HTTP integration smoke test
        working-directory: services/api
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/mekuin-api ./cmd/api
      - name: Run API and exercise authenticated catalog, inventory and procurement flows
        env:
          DATABASE_URL: postgres://mekuin_app:ci-runtime-password@localhost:5432/mekuin?sslmode=disable
          WEB_ORIGIN: http://localhost:3000
          SESSION_COOKIE_SECURE: "false"
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          SMTP_FROM: no-reply@mekuin.test
          JWT_SECRET: ci-auth-code-hmac-secret-at-least-32-characters
          AUTH_ENCRYPTION_KEY: ci-mfa-encryption-key-at-least-32-characters
          MAILPIT_API_URL: http://127.0.0.1:8025
        run: |
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8025/api/v1/info >/dev/null && break; sleep 1; done
          /tmp/mekuin-api >/tmp/mekuin-api.log 2>&1 &
          API_PID=$!
          trap 'status=$?; kill "$API_PID" 2>/dev/null || true; if [ "$status" -ne 0 ]; then tail -200 /tmp/mekuin-api.log || true; fi; exit "$status"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/ready >/dev/null
          sh db/tests/api_catalog_smoke.sh
          sh db/tests/api_inventory_procurement_smoke.sh
      - name: Upload API integration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mekuin-api-integration-log
          path: /tmp/mekuin-api.log
          if-no-files-found: ignore

  web:
    name: Next.js production checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
        run: npm run build
